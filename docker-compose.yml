services:
  chromadb:
    image: chromadb/chroma:latest
    container_name: propia-chromadb
    ports:
      - "8000:8000"
    volumes:
      - chromadb-data:/data
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c '(echo > /dev/tcp/localhost/8000) 2>/dev/null' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  chromadb-data:
    name: propia-chromadb-data
